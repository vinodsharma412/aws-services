# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NSE Stock Dashboard — 100% Serverless CI/CD Pipeline
#
# No EC2. No SSH. No FastAPI framework. Pure Lambda handlers.
#
# AWS services deployed here:
#   Lambda  (API, Worker, WebSocket, DynamoDB Streams, SES, DLQ Alert)
#   S3      (frontend static files)
#   CloudFront  (CDN cache invalidation)
#
# Flow:
#   push develop → [1] Lint+Build → [2] Deploy STAGING (auto) → [3] Deploy PROD (approval)
#
# GitHub Secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   S3_FRONTEND_BUCKET
#   STAGING_API_URL, PROD_API_URL
#
# GitHub Environments:
#   staging  — no protection (auto-deploy)
#   prod     — Required reviewers: your GitHub username
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Deploy Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy'
        required: true
        default: 'staging'
        type: choice
        options: [ staging, prod ]

env:
  AWS_REGION: ap-south-1
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PANDAS_LAYER: "arn:aws:lambda:ap-south-1:336392948345:layer:AWSSDKPandas-Python312:16"

jobs:

  # ── 1. Lint + Build artifacts ─────────────────────────────────────────────
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps + lint
        run: |
          pip install ruff aws-xray-sdk -q
          pip install -r backend/requirements.txt -q
          ruff check backend/handlers/ backend/app/

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        run: npm ci
        working-directory: frontend

      # Build staging frontend
      - name: Build frontend — STAGING
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.STAGING_API_URL }}
          REACT_APP_STAGE: staging
          PUBLIC_URL: /
          CI: false

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-staging
          path: frontend/build/
          retention-days: 1

      # Build prod frontend
      - name: Build frontend — PROD
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.PROD_API_URL }}
          REACT_APP_STAGE: prod
          PUBLIC_URL: /
          CI: false

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-prod
          path: frontend/build/
          retention-days: 1

      # ── Build API Lambda package (handlers/ + app/ + deps) ──────────────
      - name: Build API Lambda package
        run: |
          BUILD=/tmp/api-lambda
          rm -rf $BUILD && mkdir -p $BUILD
          # Install deps (Linux x86_64 for Lambda, exclude playwright)
          pip install -r backend/requirements.txt -t $BUILD/ -q \
            --platform manylinux2014_x86_64 --implementation cp \
            --python-version 3.12 --only-binary=:all: 2>/dev/null || \
          pip install -r backend/requirements.txt -t $BUILD/ -q
          # Copy application code
          cp -r backend/handlers backend/app $BUILD/
          # Remove heavy unused packages
          rm -rf $BUILD/playwright $BUILD/playwright-* 2>/dev/null || true
          # Strip __pycache__
          find $BUILD -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find $BUILD -name "*.pyc" -delete 2>/dev/null || true
          cd $BUILD && zip -r /tmp/api-lambda.zip . -q
          echo "API Lambda: $(du -sh /tmp/api-lambda.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: api-lambda-zip
          path: /tmp/api-lambda.zip
          retention-days: 1

      # ── Build Worker Lambda ───────────────────────────────────────────────
      - name: Build Worker Lambda package
        run: |
          BUILD=/tmp/worker-lambda
          rm -rf $BUILD && mkdir -p $BUILD
          pip install httpx beautifulsoup4 aws-xray-sdk boto3 -t $BUILD/ -q \
            --platform manylinux2014_x86_64 --implementation cp \
            --python-version 3.12 --only-binary=:all: 2>/dev/null || \
          pip install httpx beautifulsoup4 aws-xray-sdk boto3 -t $BUILD/ -q
          cp infrastructure/lambda/scraping_worker/handler.py $BUILD/
          find $BUILD -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          cd $BUILD && zip -r /tmp/worker-lambda.zip . -q
          echo "Worker Lambda: $(du -sh /tmp/worker-lambda.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: worker-lambda-zip
          path: /tmp/worker-lambda.zip
          retention-days: 1

      # ── Build WebSocket + Streams Lambda ──────────────────────────────────
      - name: Build WebSocket Lambda package
        run: |
          BUILD=/tmp/ws-lambda
          rm -rf $BUILD && mkdir -p $BUILD
          pip install aws-xray-sdk boto3 -t $BUILD/ -q \
            --platform manylinux2014_x86_64 --implementation cp \
            --python-version 3.12 --only-binary=:all: 2>/dev/null || \
          pip install aws-xray-sdk boto3 -t $BUILD/ -q
          cp backend/handlers/websocket.py $BUILD/handler.py
          cp backend/handlers/_base.py $BUILD/
          cp backend/handlers/dynamo_streams.py $BUILD/dynamo_streams.py
          cp backend/handlers/ses_notifications.py $BUILD/ses_notifications.py
          find $BUILD -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          cd $BUILD && zip -r /tmp/ws-lambda.zip . -q
          echo "WS Lambda: $(du -sh /tmp/ws-lambda.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ws-lambda-zip
          path: /tmp/ws-lambda.zip
          retention-days: 1

  # ── 2. Deploy STAGING (auto on every push) ────────────────────────────────
  deploy-staging:
    name: Deploy STAGING
    needs: lint-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts/

      - name: Deploy shared Lambda Layer
        run: |
          BUILD=/tmp/layer-build && rm -rf $BUILD && mkdir -p $BUILD/python/utils
          pip install aws-xray-sdk -t $BUILD/python/ -q \
            --platform manylinux2014_x86_64 --implementation cp \
            --python-version 3.12 --only-binary=:all: 2>/dev/null || \
          pip install aws-xray-sdk -t $BUILD/python/ -q
          cp infrastructure/lambda/layer/python/utils/*.py $BUILD/python/utils/
          cd $BUILD && zip -r /tmp/layer.zip python/ -q
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name nse-shared-utils \
            --zip-file fileb:///tmp/layer.zip \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "LAYER_ARN=$LAYER_ARN" >> $GITHUB_ENV
          aws ssm put-parameter --name /nse/staging/shared-layer-arn \
            --value "$LAYER_ARN" --type String --overwrite

      - name: Deploy API Lambda — STAGING
        run: |
          FUNC="nse-api-staging"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ROLE="arn:aws:iam::${ACCOUNT}:role/NSELambdaRole"
          ENV="Variables={STAGE=staging,AWS_REGION=${{ env.AWS_REGION }}}"
          LAYERS="${{ env.PANDAS_LAYER }},${{ env.LAYER_ARN }}"
          ZIP="fileb:///tmp/artifacts/api-lambda-zip/api-lambda.zip"
          if aws lambda get-function --function-name $FUNC 2>/dev/null; then
            aws lambda update-function-code --function-name $FUNC --zip-file $ZIP > /dev/null
            aws lambda wait function-updated --function-name $FUNC
            aws lambda update-function-configuration --function-name $FUNC \
              --layers $LAYERS --environment "$ENV" --timeout 30 --memory-size 512 > /dev/null
          else
            aws lambda create-function --function-name $FUNC \
              --runtime python3.12 --handler handlers.health.handler \
              --zip-file $ZIP --role $ROLE --timeout 30 --memory-size 512 \
              --layers $LAYERS --environment "$ENV" > /dev/null
            aws lambda wait function-active --function-name $FUNC
          fi
          echo "✓ nse-api-staging deployed"

      - name: Deploy Worker Lambda — STAGING
        run: |
          FUNC="nse-scraping-worker-staging"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ROLE="arn:aws:iam::${ACCOUNT}:role/NSELambdaRole"
          ZIP="fileb:///tmp/artifacts/worker-lambda-zip/worker-lambda.zip"
          ENV="Variables={STAGE=staging,AWS_REGION=${{ env.AWS_REGION }}}"
          if aws lambda get-function --function-name $FUNC 2>/dev/null; then
            aws lambda update-function-code --function-name $FUNC --zip-file $ZIP > /dev/null
          else
            aws lambda create-function --function-name $FUNC \
              --runtime python3.12 --handler handler.lambda_handler \
              --zip-file $ZIP --role $ROLE --timeout 120 --memory-size 256 \
              --environment "$ENV" > /dev/null
          fi
          echo "✓ nse-scraping-worker-staging deployed"

      - name: Deploy WebSocket Lambda — STAGING
        run: |
          FUNC="nse-ws-staging"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ROLE="arn:aws:iam::${ACCOUNT}:role/NSELambdaRole"
          ZIP="fileb:///tmp/artifacts/ws-lambda-zip/ws-lambda.zip"
          ENV="Variables={STAGE=staging,AWS_REGION=${{ env.AWS_REGION }}}"
          if aws lambda get-function --function-name $FUNC 2>/dev/null; then
            aws lambda update-function-code --function-name $FUNC --zip-file $ZIP > /dev/null
          else
            aws lambda create-function --function-name $FUNC \
              --runtime python3.12 --handler handler.handler \
              --zip-file $ZIP --role $ROLE --timeout 30 --memory-size 256 \
              --environment "$ENV" > /dev/null
          fi
          echo "✓ nse-ws-staging deployed"

      - name: Health check — STAGING
        run: |
          sleep 10
          curl -fsS "${{ secrets.STAGING_API_URL }}/health/" \
            && echo "✓ STAGING health OK" \
            || (echo "✗ STAGING health FAILED" && exit 1)

      - name: Upload frontend → S3 staging
        run: |
          aws s3 sync /tmp/artifacts/frontend-staging/static/ \
            s3://${{ secrets.S3_FRONTEND_BUCKET }}/staging/static/ \
            --cache-control "max-age=31536000,immutable" --delete
          aws s3 sync /tmp/artifacts/frontend-staging/ \
            s3://${{ secrets.S3_FRONTEND_BUCKET }}/staging/ \
            --cache-control "no-cache,no-store" --exclude "static/*" --delete

      - name: Invalidate CloudFront — STAGING
        run: |
          DIST=$(aws ssm get-parameter --name /nse/staging/cloudfront-dist-id \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          [ -n "$DIST" ] && aws cloudfront create-invalidation \
            --distribution-id "$DIST" --paths "/staging/*" || true

  # ── 3. Deploy PROD (manual approval) ─────────────────────────────────────
  deploy-prod:
    name: Deploy PROD
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts/

      - name: Deploy API Lambda — PROD
        run: |
          FUNC="nse-api-prod"
          LAYER=$(aws ssm get-parameter --name /nse/prod/shared-layer-arn \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          LAYERS="${{ env.PANDAS_LAYER }}${LAYER:+,$LAYER}"
          ZIP="fileb:///tmp/artifacts/api-lambda-zip/api-lambda.zip"
          aws lambda update-function-code --function-name $FUNC --zip-file $ZIP > /dev/null
          aws lambda wait function-updated --function-name $FUNC
          aws lambda update-function-configuration --function-name $FUNC \
            --layers $LAYERS --environment "Variables={STAGE=prod,AWS_REGION=${{ env.AWS_REGION }}}" > /dev/null
          echo "✓ nse-api-prod deployed"

      - name: Deploy Worker + WS Lambda — PROD
        run: |
          for FUNC_ZIP in "nse-scraping-worker-prod:worker-lambda-zip/worker-lambda.zip" "nse-ws-prod:ws-lambda-zip/ws-lambda.zip"; do
            FUNC="${FUNC_ZIP%%:*}"; ZIP="${FUNC_ZIP#*:}"
            aws lambda update-function-code --function-name $FUNC \
              --zip-file "fileb:///tmp/artifacts/${ZIP}" > /dev/null 2>/dev/null || true
            echo "✓ $FUNC deployed"
          done

      - name: Health check — PROD
        run: |
          sleep 10
          curl -fsS "${{ secrets.PROD_API_URL }}/health/" \
            && echo "✓ PROD health OK" || (echo "✗ PROD FAILED" && exit 1)

      - name: Upload frontend → S3 prod
        run: |
          aws s3 sync /tmp/artifacts/frontend-prod/static/ \
            s3://${{ secrets.S3_FRONTEND_BUCKET }}/static/ \
            --cache-control "max-age=31536000,immutable" --delete
          aws s3 sync /tmp/artifacts/frontend-prod/ \
            s3://${{ secrets.S3_FRONTEND_BUCKET }}/ \
            --cache-control "no-cache,no-store" --exclude "static/*" --delete

      - name: Invalidate CloudFront — PROD
        run: |
          DIST=$(aws ssm get-parameter --name /nse/prod/cloudfront-dist-id \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          [ -n "$DIST" ] && aws cloudfront create-invalidation \
            --distribution-id "$DIST" --paths "/*" || true
